<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GAMING ARENA - ULTRA 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#050914;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;padding:18px}
.panel{background:#06101dcc;border:1px solid #ffffff35;border-radius:12px;padding:12px 18px;backdrop-filter:blur(10px)}
#speed{font-size:34px;font-weight:900;color:#00eaff}
.small{font-size:11px;color:#aab8ca;letter-spacing:2px}
#score{font-size:23px;color:#ffe45c;font-weight:bold}
#nitroBox{position:absolute;top:110px;left:50%;transform:translateX(-50%);width:180px;text-align:center}
#nitroBar{height:9px;background:#26334a;border-radius:20px;overflow:hidden;margin-top:7px}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#00d9ff,#a500ff)}
#message{position:absolute;top:43%;width:100%;text-align:center;font-size:25px;font-weight:900;text-shadow:0 3px 12px black}
#start{position:absolute;inset:0;background:linear-gradient(#06101dcc,#02040dee);display:flex;align-items:center;justify-content:center;pointer-events:auto}
.startCard{text-align:center;padding:30px;width:min(90%,450px);background:#101b2c;border:1px solid #00cfff66;border-radius:22px;box-shadow:0 0 50px #00cfff22}
h1{font-size:35px;color:#00eaff;letter-spacing:2px}
.startCard p{color:#b5c7da;margin:16px 0 25px;line-height:1.6}
button{border:0;background:linear-gradient(90deg,#00cfff,#615cff);color:white;font-weight:bold;padding:15px 35px;border-radius:30px;font-size:17px;cursor:pointer}
#controls{position:fixed;bottom:22px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.group{display:flex;gap:12px;align-items:end}
.ctrl{pointer-events:auto;width:65px;height:65px;border:1px solid #ffffff70;border-radius:17px;background:#101e36bb;color:white;font-size:24px;font-weight:bold;touch-action:none;user-select:none}
.ctrl:active{background:#00a9dccc}
#rightControls{display:flex;gap:10px;align-items:end}
#nitroBtn{background:#163b75cc;color:#00eaff}
#brakeBtn{background:#75252ccc}
#help{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#c4d5e8;white-space:nowrap}
@media(max-width:600px){
 .top{padding:9px}.panel{padding:9px 12px}
 #speed{font-size:25px}.ctrl{width:58px;height:58px}
 #help{display:none}
}
</style>
</head>
<body>
<div id="hud">
 <div class="top">
  <div class="panel"><div class="small">SPEED</div><div><span id="speed">000</span> <span class="small">KM/H</span></div></div>
  <div class="panel" style="text-align:right"><div class="small">DISTANCE</div><div id="distance">0 m</div></div>
  <div class="panel"><div class="small">COINS</div><div id="score">0</div></div>
 </div>
 <div id="nitroBox" class="panel">
  <div class="small">NITRO BOOST</div>
  <div id="nitroBar"><div id="nitroFill"></div></div>
 </div>
 <div id="message"></div>
</div>

<div id="start">
 <div class="startCard">
  <h1>GAMING ARENA</h1>
  <div style="color:#9b9bff;letter-spacing:5px;margin-top:5px">ULTRA 3D RACING</div>
  <p>Race through the neon city. Collect coins, dodge traffic and unleash your nitro!</p>
  <button id="startBtn">START RACING</button>
  <p style="font-size:11px;margin-bottom:0">WASD / ARROW KEYS · SPACE = NITRO · DOWN = BRAKE</p>
 </div>
</div>

<div id="controls">
 <div class="group">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div id="rightControls">
  <button class="ctrl" id="brakeBtn">▼</button>
  <button class="ctrl" id="nitroBtn">⚡</button>
 </div>
</div>
<div id="help">ARROWS / WASD TO STEER · SPACE TO BOOST · DOWN TO BRAKE</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){
 document.getElementById("message").textContent="Could not load 3D engine. Check your internet connection.";
 throw new Error("Three.js failed to load");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x829fc1);
scene.fog=new THREE.Fog(0x829fc1,65,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,5.5,12);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xc4e3ff,0x303044,1.5));
const sun=new THREE.DirectionalLight(0xffe2bc,2.2);
sun.position.set(-35,55,25);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-45;
sun.shadow.camera.right=45;
sun.shadow.camera.top=50;
sun.shadow.camera.bottom=-50;
scene.add(sun);

const roadMat=new THREE.MeshStandardMaterial({color:0x242b35,roughness:.92});
const lineMat=new THREE.MeshStandardMaterial({color:0xf3f5ff,roughness:.6});
const darkMat=new THREE.MeshStandardMaterial({color:0x121923,roughness:.9});
const neonMat=new THREE.MeshStandardMaterial({color:0x00dfff,emissive:0x007cbb,emissiveIntensity:2});
const goldMat=new THREE.MeshStandardMaterial({color:0xffd447,metalness:.65,roughness:.25,emissive:0x4a2700});

function box(parent,x,y,z,w,h,d,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

const ground=box(scene,0,-.55,-110,500,.5,400,new THREE.MeshStandardMaterial({color:0x25313a}));
const road=box(scene,0,-.27,-110,16,.12,400,roadMat);

// Road borders
for(let x of [-8.1,8.1]){
 box(scene,x,-.15,-110,.22,.2,400,neonMat);
}
for(let x of [-2.7,2.7]){
 for(let i=0;i<35;i++){
  box(scene,x,-.19,-i*12,0.13,.035,5,lineMat);
 }
}

// City buildings
const buildings=[];
const buildingMats=[
 0x28394f,0x34435c,0x202d40,0x3d4d60,0x27354a
].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.8}));

const windowMat=new THREE.MeshStandardMaterial({
 color:0xffd98a,emissive:0xffa82d,emissiveIntensity:.7
});
const blueWindow=new THREE.MeshStandardMaterial({
 color:0x56c9ff,emissive:0x146b9b,emissiveIntensity:.6
});

function makeBuilding(x,z){
 const h=12+Math.random()*32;
 const w=7+Math.random()*9;
 const d=8+Math.random()*12;
 const g=new THREE.Group();
 g.position.set(x,0,z);
 const mat=buildingMats[Math.floor(Math.random()*buildingMats.length)];
 box(g,0,h/2,0,w,h,d,mat);
 // windows on front
 const rows=Math.floor(h/2.4);
 const cols=Math.floor(w/1.8);
 for(let a=0;a<cols;a++){
  for(let b=0;b<rows;b++){
   if(Math.random()>.17){
    box(g,-w/2+1+a*1.65,1.5+b*2.25,d/2+.025,.65,.95,.07,
     Math.random()>.5?windowMat:blueWindow);
   }
  }
 }
 // roof structure
 box(g,0,h+.5,0,w*.35,1.1,d*.35,mat);
 scene.add(g);
 buildings.push({g,z});
}
for(let side of [-1,1]){
 for(let i=0;i<30;i++)makeBuilding(side*(17+Math.random()*23),-i*18-10);
}

// Street lights
const lights=[];
const poleMat=new THREE.MeshStandardMaterial({color:0x65788d,metalness:.7,roughness:.3});
const lampMat=new THREE.MeshStandardMaterial({color:0xaff5ff,emissive:0x35bfff,emissiveIntensity:2});
for(let i=0;i<25;i++){
 for(let side of [-1,1]){
  const g=new THREE.Group();
  g.position.set(side*9,0,-i*20);
  box(g,0,3,0,.18,6,.18,poleMat);
  box(g,-side*1.4,5.9,0,2.8,.16,.18,poleMat);
  box(g,-side*2.5,5.8,0,.9,.22,.7,lampMat);
  scene.add(g);
  lights.push(g);
 }
}

// Player car
const player=new THREE.Group();
scene.add(player);
player.position.set(0,0,4);

const carPaint=new THREE.MeshStandardMaterial({
 color:0xe51b38,metalness:.78,roughness:.22
});
const black=new THREE.MeshStandardMaterial({color:0x10151c,metalness:.5,roughness:.3});
const glass=new THREE.MeshStandardMaterial({
 color:0x142e43,metalness:.5,roughness:.12
});
const tireMat=new THREE.MeshStandardMaterial({color:0x090b0e,roughness:.9});
const rimMat=new THREE.MeshStandardMaterial({color:0xb8c5d3,metalness:.9,roughness:.2});
const lightMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:2});
const tailMat=new THREE.MeshStandardMaterial({color:0xff1010,emissive:0xff0000,emissiveIntensity:2});

box(player,0,.85,0,2.1,.65,4.1,carPaint);
box(player,0,1.35,-.35,1.7,.75,2.15,carPaint);
box(player,0,1.45,-.28,1.55,.57,1.85,glass);
box(player,0,.55,-2.08,1.65,.22,.25,black);
box(player,0,.45,2.04,1.9,.3,.16,black);
box(player,0,.42,-2.19,1.7,.13,.12,tailMat);

// Front lights
for(let x of [-.72,.72]){
 box(player,x,.82,-2.08,.42,.2,.08,lightMat);
 box(player,x,.84,2.1,.42,.18,.08,tailMat);
}

// Wheels
const wheels=[];
for(let x of [-1.08,1.08]){
 for(let z of [-1.35,1.35]){
  const wheel=new THREE.Group();
  wheel.position.set(x,.48,z);
  const tyre=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,24),tireMat);
  tyre.rotation.z=Math.PI/2;
  tyre.castShadow=true;
  wheel.add(tyre);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.3,20),rimMat);
  rim.rotation.z=Math.PI/2;
  wheel.add(rim);
  player.add(wheel);
  wheels.push(wheel);
 }
}

// Nitro exhaust glow
const exhaust=new THREE.Mesh(
 new THREE.ConeGeometry(.22,1.1,12),
 new THREE.MeshBasicMaterial({color:0x00cfff})
);
exhaust.rotation.x=Math.PI/2;
exhaust.position.set(0,.6,2.6);
exhaust.visible=false;
player.add(exhaust);

// Traffic cars
const traffic=[];
const trafficColors=[0x1787df,0xf0c52c,0xeeeeee,0x24b877,0x8537ce,0x252525];
function makeTraffic(z){
 const g=new THREE.Group();
 const mat=new THREE.MeshStandardMaterial({
  color:trafficColors[Math.floor(Math.random()*trafficColors.length)],
  metalness:.6,roughness:.28
 });
 box(g,0,.7,0,1.8,.65,3.5,mat);
 box(g,0,1.15,-.2,1.45,.55,1.7,glass);
 for(let x of [-.94,.94]){
  for(let zz of [-1,1]){
   const t=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.22,16),tireMat);
   t.rotation.z=Math.PI/2;
   t.position.set(x,.38,zz);
   g.add(t);
  }
 }
 g.position.set([-4.8,0,4.8][Math.floor(Math.random()*3)],0,z);
 scene.add(g);
 traffic.push(g);
}
for(let i=0;i<9;i++)makeTraffic(-35-i*35);

// Coins
const coins=[];
const coinGeo=new THREE.TorusGeometry(.55,.15,12,24);
for(let i=0;i<35;i++){
 const c=new THREE.Mesh(coinGeo,goldMat);
 c.position.set([-4.5,0,4.5][i%3],1.3,-25-i*17);
 scene.add(c);
 coins.push(c);
}

// Particles
const particles=[];
const particleGeo=new THREE.SphereGeometry(.09,6,6);
function particle(x,y,z,color){
 const m=new THREE.Mesh(particleGeo,new THREE.MeshBasicMaterial({color}));
 m.position.set(x,y,z);
 scene.add(m);
 particles.push({m,life:1,v:new THREE.Vector3(
  (Math.random()-.5)*.15,Math.random()*.1,Math.random()*.3
 )});
}

// Game state
let running=false;
let speed=0;
let distance=0;
let score=0;
let nitro=100;
let boost=false;
let braking=false;
let steer=0;
let crashed=0;
const keys={};
const speedEl=document.getElementById("speed");
const distanceEl=document.getElementById("distance");
const scoreEl=document.getElementById("score");
const nitroFill=document.getElementById("nitroFill");
const startScreen=document.getElementById("start");
const message=document.getElementById("message");

function startGame(){
 running=true;
 startScreen.style.display="none";
 speed=0;
}
document.getElementById("startBtn").addEventListener("click",startGame);

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space")e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function hold(id,callback){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  callback(true);
 });
 const off=e=>{e.preventDefault();callback(false)};
 el.addEventListener("pointerup",off);
 el.addEventListener("pointercancel",off);
 el.addEventListener("lostpointercapture",off);
}
hold("left",v=>keys.left=v);
hold("right",v=>keys.right=v);
hold("nitroBtn",v=>boost=v);
hold("brakeBtn",v=>braking=v);

function resetTraffic(car){
 car.position.z=-220-Math.random()*100;
 car.position.x=[-4.8,0,4.8][Math.floor(Math.random()*3)];
}
function resetCoin(c){
 c.position.z=-250-Math.random()*150;
 c.position.x=[-4.5,0,4.5][Math.floor(Math.random()*3)];
}

// Animation
const clock=new THREE.Clock();
let elapsed=0;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);
 elapsed+=dt;

 if(running){
  const left=keys.left||keys.a||keys.arrowleft;
  const right=keys.right||keys.d||keys.arrowright;
  const useBoost=boost&&(nitro>0)&&!braking;

  if(useBoost)nitro=Math.max(0,nitro-24*dt);
  else nitro=Math.min(100,nitro+7*dt);

  const target=braking?35:(useBoost?260:175);
  speed+=(target-speed)*dt*1.5;
  const forward=speed/3.6;

  if(left)player.position.x-=7*dt;
  if(right)player.position.x+=7*dt;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-5.4,5.4);

  player.rotation.z=left?.12:right?-.12:player.rotation.z*.88;
  player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,
   left?.12:right?-.12:0,dt*5);

  wheels.forEach(w=>w.rotation.x-=forward*dt*1.5);
  exhaust.visible=useBoost;
  exhaust.scale.setScalar(useBoost?(.7+Math.random()*.5):0.01);

  // World movement
  road.position.z=0;
  distance+=forward*dt;
  buildings.forEach(b=>{
   b.g.position.z+=forward*dt;
   if(b.g.position.z>35)b.g.position.z-=540;
  });
  lights.forEach(l=>{
   l.position.z+=forward*dt;
   if(l.position.z>25)l.position.z-=500;
  });

  traffic.forEach(car=>{
   car.position.z+=forward*dt*.8;
   if(car.position.z>13)resetTraffic(car);
   if(Math.abs(car.position.z-player.position.z)<2.6 &&
      Math.abs(car.position.x-player.position.x)<1.7 && crashed<=0){
    crashed=1.4;
    speed*=.45;
    message.textContent="CRASH!";
    for(let i=0;i<12;i++)particle(player.position.x,1,3,0xffaa22);
   }
  });

  coins.forEach(c=>{
   c.rotation.y+=dt*3;
   c.position.z+=forward*dt;
   if(c.position.z>10)resetCoin(c);
   if(c.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,1,0)))<1.7){
    score+=10;
    resetCoin(c);
   }
  });

  crashed-=dt;
  if(crashed<=0)message.textContent="";

  if(useBoost&&Math.random()<.6)particle(player.position.x,.7,2.5,0x00cfff);
  particles.forEach((p,i)=>{
   p.m.position.addScaledVector(p.v,dt*30);
   p.life-=dt*1.8;
   p.m.scale.setScalar(Math.max(.01,p.life));
   if(p.life<=0){
    scene.remove(p.m);
    particles.splice(i,1);
   }
  });

  camera.position.x+=(player.position.x*.3-camera.position.x)*dt*2.2;
  camera.position.y+=(5.3-camera.position.y)*dt*2;
  camera.position.z+=(12-camera.position.z)*dt*2;
  camera.lookAt(player.position.x*.35,1,-7);

  speedEl.textContent=Math.round(speed).toString().padStart(3,"0");
  distanceEl.textContent=Math.floor(distance)+" m";
  scoreEl.textContent=score;
  nitroFill.style.width=nitro+"%";
 }else{
  player.position.y=Math.sin(elapsed*2)*.035;
  player.rotation.y=Math.sin(elapsed)*.025;
  camera.lookAt(0,1,-5);
 }

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
