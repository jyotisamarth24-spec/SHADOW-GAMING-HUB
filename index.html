
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMING ARENA 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050814;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#071426dd;border:1px solid #00eaff;border-radius:12px;padding:10px 14px;box-shadow:0 0 12px #00eaff55;font-weight:bold}
#brand{color:#00eaff;font-size:19px}
#stats{font-size:13px;line-height:1.8}
#message{position:fixed;top:43%;width:100%;text-align:center;font-size:30px;font-weight:bold;text-shadow:0 0 15px #00eaff;pointer-events:none}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.group{display:flex;gap:10px;align-items:center}
button{pointer-events:auto;border:1px solid #00eaff;background:#071426dd;color:white;border-radius:14px;min-width:58px;height:58px;font-size:23px;font-weight:bold;touch-action:none;box-shadow:0 0 12px #00eaff44}
button:active{background:#007c99}
.boost{font-size:12px;background:#10234a;border-color:#ffdc38}
#hint{position:fixed;bottom:92px;width:100%;text-align:center;color:#c6f8ff;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <div class="panel"><div id="brand">⚡ GAMING ARENA</div><small>3D STREET RACER</small></div>
  <div class="panel" id="stats">DISTANCE: 0 m<br>COINS: 0<br>SPEED: 0 km/h</div>
</div>
<div id="message">RACE STARTED!</div>
<div id="hint">← → STEER · ↑ ACCELERATE · SPACE NITRO · ↓ BRAKE</div>
<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="group">
    <button id="brake">▼</button>
    <button id="gas">▲</button>
    <button id="nitro" class="boost">⚡<br>NITRO</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const message = document.getElementById("message");
if (!window.THREE) {
  message.textContent = "3D LIBRARY FAILED TO LOAD — CHECK INTERNET";
  return;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071326);
scene.fog = new THREE.Fog(0x071326, 35, 180);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 300
);
camera.position.set(0, 6, 12);
camera.lookAt(0, 0, -25);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9edbff, 0x263044, 2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-15, 30, 10);
sun.castShadow = true;
scene.add(sun);

function mat(color, metalness=0, roughness=0.55, emissive=0x000000) {
  return new THREE.MeshStandardMaterial({
    color, metalness, roughness, emissive
  });
}
const roadMat = mat(0x242b38, 0.1);
const whiteMat = mat(0xffffff, 0, 0.4, 0x555555);
const cyanMat = mat(0x00dfff, 0.2, 0.25, 0x007799);
const goldMat = mat(0xffc928, 0.6, 0.25, 0x664400);
const darkMat = mat(0x101521, 0.2);
const grassMat = mat(0x101e29);

function cube(parent, x,y,z, sx,sy,sz, material) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz), material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Ground and long highway
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  grassMat
);
ground.rotation.x = -Math.PI/2;
ground.position.set(0,-0.14,-100);
ground.receiveShadow = true;
scene.add(ground);

cube(scene,0,-0.05,-85,16,0.12,210,roadMat);

// Road shoulders and lane separators
for (const x of [-8,8]) cube(scene,x,0.02,-85,0.22,0.06,210,cyanMat);
const marks=[];
for(let z=-180;z<18;z+=9){
  for(const x of [-2.65,2.65]){
    marks.push(cube(scene,x,0.025,z,0.12,0.035,4,whiteMat));
  }
}

// Make a detailed low-poly sports car
function makeCar(color=0xff173e, player=false) {
  const car = new THREE.Group();
  const paint = mat(color,0.55,0.25);
  const glass = mat(0x8deaff,0.5,0.15);
  const rubber = mat(0x080b12);
  const rim = mat(0xb8c7d9,0.75,0.22);
  cube(car,0,0.62,0,1.8,0.48,3.5,paint);
  cube(car,0,0.98,-0.35,1.4,0.55,1.65,paint);
  cube(car,0,1.03,-0.39,1.24,0.39,1.38,glass);
  cube(car,0,0.56,-1.79,1.75,0.14,0.18,darkMat);
  cube(car,0,0.5,1.79,1.7,0.15,0.15,darkMat);
  cube(car,-0.57,0.76,-1.78,0.3,0.14,0.08,whiteMat);
  cube(car,0.57,0.76,-1.78,0.3,0.14,0.08,whiteMat);
  const tail=mat(0xff001c,0,0.3,0x880011);
  cube(car,-0.58,0.75,1.78,0.35,0.14,0.08,tail);
  cube(car,0.58,0.75,1.78,0.35,0.14,0.08,tail);

  for(const x of [-0.94,0.94]){
    for(const z of [-1.15,1.15]){
      const wheel=new THREE.Mesh(
        new THREE.CylinderGeometry(0.38,0.38,0.25,16),
        rubber
      );
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(x,0.38,z);
      car.add(wheel);
      const hub=new THREE.Mesh(
        new THREE.CylinderGeometry(0.19,0.19,0.265,12),rim
      );
      hub.rotation.z=Math.PI/2;
      hub.position.set(x,0.38,z);
      car.add(hub);
    }
  }
  if(player){
    const glow=new THREE.PointLight(0x00cfff,2,8);
    glow.position.set(0,1,-2);
    car.add(glow);
  }
  scene.add(car);
  return car;
}

const player=makeCar(0x00aaff,true);
player.position.set(0,0.1,3);
player.scale.set(1,1,1);

// City buildings on both sides
const buildings=[];
for(let i=0;i<46;i++){
  for(const side of [-1,1]){
    const h=5+Math.random()*19;
    const w=3+Math.random()*5;
    const b=new THREE.Group();
    const buildingMat=mat(
      [0x182943,0x202d43,0x17243b,0x30354c][i%4],
      0.25,0.55
    );
    cube(b,0,h/2,0,w,h,5,buildingMat);
    for(let y=2;y<h;y+=2.7){
      for(let x=-w/2+0.6;x<w/2;x+=1.25){
        cube(b,x,y,2.53,0.42,0.75,0.035,
          mat(i%2?0x00baff:0xffb72b,0.1,0.3,
          i%2?0x004466:0x443000));
      }
    }
    b.position.set(side*(12+Math.random()*8),0,-i*8-10);
    scene.add(b);
    buildings.push({group:b,side});
  }
}

// Neon street lamps
const lamps=[];
for(let i=0;i<20;i++){
  for(const side of [-1,1]){
    const g=new THREE.Group();
    cube(g,0,2.3,0,0.12,4.6,0.12,darkMat);
    cube(g,-0.6,4.5,0,1.2,0.12,0.12,cyanMat);
    const light=new THREE.PointLight(0x00bbff,1.3,12);
    light.position.set(-0.6,4.25,0);
    g.add(light);
    g.position.set(side*9,0,-i*17-10);
    scene.add(g);
    lamps.push(g);
  }
}

// Traffic cars and coins
const traffic=[];
const coins=[];
const lanes=[-5.1,0,5.1];

for(let i=0;i<8;i++){
  const car=makeCar([0xff253a,0xffa600,0x8a49ff,0xffffff][i%4]);
  car.scale.setScalar(0.88);
  car.position.set(lanes[Math.floor(Math.random()*3)],0.1,-35-i*23);
  traffic.push(car);
}
for(let i=0;i<24;i++){
  const coin=new THREE.Mesh(
    new THREE.TorusGeometry(0.52,0.16,10,20),goldMat
  );
  coin.position.set(lanes[i%3],1.25,-15-i*12);
  scene.add(coin);
  coins.push(coin);
}

// Input controls
const keys={};
addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))
    e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function hold(id,key){
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();keys[key]=true;
    el.setPointerCapture(e.pointerId);
  });
  const release=e=>{e.preventDefault();keys[key]=false;};
  el.addEventListener("pointerup",release);
  el.addEventListener("pointercancel",release);
  el.addEventListener("lostpointercapture",()=>keys[key]=false);
}
hold("left","arrowleft");
hold("right","arrowright");
hold("gas","arrowup");
hold("brake","arrowdown");
hold("nitro"," ");

let speed=0;
let distance=0;
let score=0;
let crashed=false;
let crashTimer=0;
let last=performance.now();

function resetTraffic(car){
  car.position.z=-150-Math.random()*45;
  car.position.x=lanes[Math.floor(Math.random()*3)];
}
function resetCoin(coin){
  coin.position.z=-180-Math.random()*60;
  coin.position.x=lanes[Math.floor(Math.random()*3)];
  coin.visible=true;
}

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,0.04);
  last=now;

  if(!crashed){
    const nitro=keys[" "]||keys["shift"];
    const accelerating=keys["arrowup"]||keys["w"];
    const braking=keys["arrowdown"]||keys["s"];
    const target=nitro?54:accelerating?38:22;
    speed+=(target-speed)*dt*1.6;
    if(braking)speed=Math.max(0,speed-75*dt);
    if(nitro)speed=Math.min(speed,68);

    if(keys["arrowleft"]||keys["a"])player.position.x-=10*dt;
    if(keys["arrowright"]||keys["d"])player.position.x+=10*dt;
    player.position.x=Math.max(-6.2,Math.min(6.2,player.position.x));
    player.rotation.z=-(player.position.x-(player.userData.oldX||0))*0.08;
    player.userData.oldX=player.position.x;

    const move=speed*dt*0.85;
    distance+=move;
    marks.forEach(m=>{m.position.z+=move;if(m.position.z>15)m.position.z-=198;});
    buildings.forEach(b=>{
      b.group.position.z+=move;
      if(b.group.position.z>25)b.group.position.z-=380;
    });
    lamps.forEach(l=>{
      l.position.z+=move;
      if(l.position.z>20)l.position.z-=340;
    });

    traffic.forEach(car=>{
      car.position.z+=move*0.95;
      if(car.position.z>10)resetTraffic(car);
      if(Math.abs(car.position.z-player.position.z)<2.5 &&
         Math.abs(car.position.x-player.position.x)<1.65){
        crashed=true;crashTimer=1.5;
        message.textContent="💥 CRASH! SLOW DOWN";
      }
    });

    coins.forEach(coin=>{
      coin.position.z+=move;
      coin.rotation.y+=dt*3;
      if(coin.position.z>8)resetCoin(coin);
      if(coin.visible &&
        Math.abs(coin.position.z-player.position.z)<2 &&
        Math.abs(coin.position.x-player.position.x)<1.5){
        coin.visible=false;
        score++;
      }
    });
  }else{
    speed=Math.max(0,speed-45*dt);
    crashTimer-=dt;
    if(crashTimer<=0){
      crashed=false;
      message.textContent="RACE RESUMED!";
    }
  }

  camera.position.x+=(player.position.x*0.32-camera.position.x)*dt*2;
  camera.lookAt(player.position.x*0.22,0.7,-24);

  document.getElementById("stats").innerHTML=
    "DISTANCE: "+Math.floor(distance)+" m<br>"+
    "COINS: "+score+"<br>"+
    "SPEED: "+Math.floor(speed*3.2)+" km/h";

  if(!crashed && distance>8)message.textContent="";
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
