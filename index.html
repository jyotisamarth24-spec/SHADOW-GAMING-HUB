<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMING ARENA - 3D Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050914;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:10px;left:0;width:100%;display:none;pointer-events:none;z-index:5}
#speedBox{margin:auto;width:155px;text-align:center;background:#071426dd;border:2px solid #00d9ff;border-radius:16px;padding:7px;box-shadow:0 0 18px #00bfff88}
#speed{font-size:35px;font-weight:900;color:#fff}
#speedBox small{color:#00eaff;letter-spacing:3px}
#stats{display:flex;justify-content:space-between;padding:8px 14px;font-weight:bold;text-shadow:0 2px 5px black}
#stats span{background:#071426cc;padding:8px 12px;border-radius:10px}
#nitroBox{height:9px;background:#333;margin:0 14px;border-radius:10px;overflow:hidden}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#00d9ff,#fff)}
#menu,#message{position:fixed;inset:0;z-index:10;background:linear-gradient(#061329dd,#02040bee);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.panel{width:min(440px,95vw);max-height:94vh;overflow:auto;background:#101d32ee;border:1px solid #00cfff;border-radius:22px;padding:22px;box-shadow:0 0 30px #00bfff44}
h1{font-size:32px;margin:5px;color:#00eaff}
h2{margin:8px}
p{color:#c7d8ed}
button,select{border:0;border-radius:12px;padding:12px 17px;margin:5px;background:#00bfff;color:#001321;font-weight:bold;font-size:15px;cursor:pointer}
button:active{transform:scale(.96)}
.secondary{background:#263c58;color:white}
#message{display:none}
#controls{position:fixed;bottom:18px;left:0;width:100%;display:none;justify-content:space-between;padding:0 18px;z-index:6;pointer-events:none}
.controlGroup{display:flex;gap:12px;pointer-events:auto}
.control{width:68px;height:68px;border-radius:50%;font-size:25px;background:#071426bb;color:white;border:2px solid #00d9ff;touch-action:none}
.control.nitro{background:#ff7a00aa;border-color:#ffb000}
#levelGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.levelBtn{padding:9px 2px;margin:0;font-size:12px}
.locked{background:#263344;color:#8292a8}
#hint{font-size:12px;color:#a9bfd7}
</style>
</head>
<body>

<div id="hud">
  <div id="speedBox">
    <div id="speed">0</div>
    <small>KM/H</small>
    <div id="maxSpeed" style="font-size:10px;color:#9bb">MAX 180</div>
  </div>
  <div id="stats">
    <span>🏁 Level <b id="levelText">1</b></span>
    <span>🪙 <b id="coinText">0</b></span>
    <span>📏 <b id="distanceText">0</b> m</span>
  </div>
  <div id="nitroBox"><div id="nitroFill"></div></div>
</div>

<div id="menu">
 <div class="panel">
  <h1>🏎️ GAMING ARENA</h1>
  <p>3D HIGHWAY RACING</p>
  <h2>Choose your race</h2>
  <button onclick="startCareer()">🏆 CAREER MODE</button>
  <button class="secondary" onclick="startFree()">🌍 FREE DRIVE</button>
  <p>Weather</p>
  <select id="weather">
   <option value="day">☀️ Day</option>
   <option value="night">🌙 Night</option>
   <option value="rain">🌧️ Rain</option>
   <option value="random">🎲 Random weather</option>
  </select>
  <p id="unlockText">Unlocked levels: 1</p>
  <button class="secondary" onclick="showLevels()">SELECT LEVEL</button>
  <div id="levelGrid" style="display:none"></div>
  <p id="hint">WASD / arrow keys to steer · Space for nitro</p>
 </div>
</div>

<div id="message">
 <div class="panel">
  <h1 id="messageTitle">CRASHED!</h1>
  <p id="messageText">Your race has ended.</p>
  <button id="restartBtn" onclick="restartRace()">🔄 RESTART</button>
  <button class="secondary" onclick="backMenu()">MENU</button>
 </div>
</div>

<div id="controls">
 <div class="controlGroup">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="controlGroup">
  <button class="control" id="brake">▼</button>
  <button class="control nitro" id="nitro">⚡</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,clock;
let player,roadLines=[],traffic=[],coins=[],rain=[];
let running=false,mode="career",level=1,unlocked=Number(localStorage.getItem("gaUnlocked")||1);
let coinCount=0,distance=0,speed=0,nitro=100;
let targetX=0,steer=0,weather="day",crash=false;
let keys={},objects=[],roadWidth=22,roadLength=180;
let maxSpeed=180,requiredCoins=5,finishDistance=1200;
let lastSpawn=0,spawnTimer=0;
const $=id=>document.getElementById(id);

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x75bfff);
 scene.fog=new THREE.Fog(0x75bfff,55,230);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
 camera.position.set(0,7,13);
 camera.lookAt(0,1,-10);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.body.appendChild(renderer.domElement);
 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xffffff,0x536078,1.2));
 let sun=new THREE.DirectionalLight(0xffffff,1.5);
 sun.position.set(-20,35,20);
 sun.castShadow=true;
 scene.add(sun);
 scene.userData.sun=sun;

 makeWorld();
 player=makeCar(0xff2020);
 player.position.set(0,0,-3);
 scene.add(player);

 for(let i=0;i<12;i++) makeTraffic(-100-i*22);
 for(let i=0;i<16;i++) makeCoin(-30-i*15);
 createRain();
 window.addEventListener("resize",resize);
 document.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key===" ")e.preventDefault()});
 document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
 bindControl("left","left");
 bindControl("right","right");
 bindControl("brake","brake");
 bindControl("nitro","nitro");
 animate();
}
function resize(){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
function mat(color,rough=.7,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
function box(w,h,d,color,x,y,z,parent=scene){
 let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function makeWorld(){
 let ground=box(400,.3,500,0x247333,0,-.35,-150);
 let road=box(roadWidth,.15,roadLength,0x242830,0,-.12,-75);
 road.receiveShadow=true;
 // road shoulders
 box(1,.2,roadLength,0xe5e5e5,-roadWidth/2-.5,-.05,-75);
 box(1,.2,roadLength,0xe5e5e5,roadWidth/2+.5,-.05,-75);
 // Six lane markings
 for(let lane=-2;lane<=2;lane++){
  for(let i=0;i<16;i++){
   let line=box(.13,.04,5,0xf4f4f4,lane*3.5,.01,-i*11);
   roadLines.push(line);
  }
 }
 // Roadside scenery
 for(let side of [-1,1]){
  for(let i=0;i<30;i++){
   let x=side*(15+Math.random()*15),z=-i*13;
   let h=5+Math.random()*18;
   let b=box(4,h,4,randomBuilding(),x,h/2-.1,z);
   objects.push({mesh:b,kind:"building"});
   if(i%2===0){
    let tree=makeTree(x+side*4,z-5);
    objects.push({mesh:tree,kind:"tree"});
   }
  }
 }
}
function randomBuilding(){
 return [0x536477,0x7c8792,0x384b60,0x9a8a75,0x3c5364][Math.floor(Math.random()*5)];
}
function makeTree(x,z){
 let g=new THREE.Group();g.position.set(x,0,z);
 let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,7),mat(0x60432a));
 trunk.position.y=1;g.add(trunk);
 let leaves=new THREE.Mesh(new THREE.ConeGeometry(1.5,4,7),mat(0x176b35));
 leaves.position.y=3.5;g.add(leaves);
 scene.add(g);return g;
}
function makeCar(color){
 let g=new THREE.Group();
 let body=new THREE.Mesh(new THREE.BoxGeometry(2.1,.65,4),mat(color,.3,.4));
 body.position.y=.85;body.castShadow=true;g.add(body);
 let hood=new THREE.Mesh(new THREE.BoxGeometry(1.9,.25,1.25),mat(color,.25,.4));
 hood.position.set(0,1.12,-1.2);g.add(hood);
 let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.8,1.8),mat(0x142b3c,.2,.5));
 cabin.position.set(0,1.48,.25);g.add(cabin);
 let roof=new THREE.Mesh(new THREE.BoxGeometry(1.45,.12,1.5),mat(color,.3,.3));
 roof.position.set(0,1.9,.25);g.add(roof);
 for(let side of [-1,1]){
  let light=new THREE.Mesh(new THREE.BoxGeometry(.48,.2,.08),mat(0xffffff,.2));
  light.position.set(side*.68,1.03,-2.02);g.add(light);
  let tail=new THREE.Mesh(new THREE.BoxGeometry(.5,.18,.08),mat(0xff0808));
  tail.position.set(side*.65,.95,2.02);g.add(tail);
  for(let z of [-1.3,1.3]){
   let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.3,16),mat(0x101010));
   wheel.rotation.z=Math.PI/2;wheel.position.set(side*1.08,.48,z);g.add(wheel);
   let rim=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.32,12),mat(0x9da8b4,.3,.8));
   rim.rotation.z=Math.PI/2;rim.position.copy(wheel.position);g.add(rim);
  }
 }
 let spoiler=box(2,.12,.25,0x151515,0,1.45,1.7,g);
 g.userData.wheels=[];
 g.traverse(o=>{if(o.geometry&&o.geometry.type==="CylinderGeometry")g.userData.wheels.push(o)});
 return g;
}
function makeTraffic(z){
 let colors=[0x1688ff,0xffcc00,0xeeeeee,0x111111,0x9c42ff,0x00bb77];
 let car=makeCar(colors[Math.floor(Math.random()*colors.length)]);
 car.scale.set(.9,.9,.9);
 car.position.set([-8.75,-5.25,-1.75,1.75,5.25,8.75][Math.floor(Math.random()*6)],0,z);
 scene.add(car);
 traffic.push(car);
}
function makeCoin(z){
 let g=new THREE.Group();
 let gold=new THREE.MeshStandardMaterial({color:0xffa500,metalness:.8,roughness:.2,emissive:0x9b4100,emissiveIntensity:.35});
 let ring=new THREE.Mesh(new THREE.TorusGeometry(.65,.16,12,32),gold);
 g.add(ring);
 let c=document.createElement("canvas");c.width=128;c.height=128;
 let ctx=c.getContext("2d");
 ctx.fillStyle="#ff9d00";ctx.beginPath();ctx.arc(64,64,46,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff3a0";ctx.font="bold 76px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("$",64,67);
 let texture=new THREE.CanvasTexture(c);
 let face=new THREE.Mesh(new THREE.CircleGeometry(.52,32),new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide}));
 face.position.z=.04;g.add(face);
 g.position.set([-8.75,-5.25,-1.75,1.75,5.25,8.75][Math.floor(Math.random()*6)],1.4,z);
 scene.add(g);coins.push(g);
}
function createRain(){
 let geo=new THREE.BufferGeometry(),positions=[];
 for(let i=0;i<500;i++)positions.push((Math.random()-.5)*55,Math.random()*30-5,Math.random()*-200);
 geo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
 let drops=new THREE.Points(geo,new THREE.PointsMaterial({color:0xaadfff,size:.12,transparent:true,opacity:.7}));
 scene.add(drops);rain.push(drops);
}
function setWeather(w){
 weather=w==="random"?["day","night","rain"][Math.floor(Math.random()*3)]:w;
 let night=weather==="night";
 let rainy=weather==="rain";
 let bg=night?0x050b20:rainy?0x455365:0x75bfff;
 scene.background.setHex(bg);scene.fog.color.setHex(bg);
 scene.fog.near=rainy?25:55;scene.fog.far=rainy?150:230;
 scene.userData.sun.intensity=night?.35:rainy?.65:1.5;
 scene.userData.sun.color.setHex(night?0x8caeff:0xffffff);
}
function bindControl(id,name){
 let b=$(id);
 const down=e=>{e.preventDefault();keys[name]=true};
 const up=e=>{e.preventDefault();keys[name]=false};
 b.addEventListener("pointerdown",down);
 b.addEventListener("pointerup",up);
 b.addEventListener("pointerleave",up);
 b.addEventListener("pointercancel",up);
}
function showLevels(){
 let grid=$("levelGrid");grid.style.display=grid.style.display==="none"?"grid":"none";
 grid.innerHTML="";
 for(let i=1;i<=100;i++){
  let b=document.createElement("button");
  b.textContent=i<=unlocked?i:"🔒";
  b.className="levelBtn "+(i>unlocked?"locked":"");
  b.disabled=i>unlocked;
  b.onclick=()=>{level=i;startCareer()};
  grid.appendChild(b);
 }
}
function startCareer(){mode="career";begin();}
function startFree(){mode="free";begin();}
function begin(){
 $("menu").style.display="none";$("message").style.display="none";
 $("hud").style.display="block";$("controls").style.display="flex";
 running=true;crash=false;coinCount=0;distance=0;speed=0;nitro=100;targetX=0;
 maxSpeed=180+Math.min(220,(level-1)*4);
 requiredCoins=5+Math.floor((level-1)/5);
 finishDistance=1200+(level-1)*100;
 setWeather($("weather").value);
 $("levelText").textContent=mode==="free"?"FREE":level;
 $("coinText").textContent=0;
 $("distanceText").textContent=0;
 $("maxSpeed").textContent="MAX "+maxSpeed;
 player.position.set(0,0,-3);
 traffic.forEach((c,i)=>{c.position.z=-80-i*24;c.position.x=randomLane()});
 coins.forEach((c,i)=>{c.position.z=-30-i*19;c.position.x=randomLane()});
}
function randomLane(){return [-8.75,-5.25,-1.75,1.75,5.25,8.75][Math.floor(Math.random()*6)]}
function restartRace(){begin();}
function backMenu(){
 running=false;$("message").style.display="none";$("hud").style.display="none";$("controls").style.display="none";$("menu").style.display="flex";
 $("unlockText").textContent="Unlocked levels: "+unlocked;
}
function endRace(won){
 running=false;
 $("message").style.display="flex";
 $("messageTitle").textContent=won?"LEVEL COMPLETE! 🏆":"CRASHED! 💥";
 if(won){
  $("messageText").textContent="Great driving! You collected "+coinCount+" coins.";
  if(mode==="career"){unlocked=Math.max(unlocked,Math.min(100,level+1));localStorage.setItem("gaUnlocked",unlocked);}
  $("restartBtn").textContent="🔄 PLAY AGAIN";
 }else{
  $("messageText").textContent="You crashed. Restart this level and try again!";
  $("restartBtn").textContent="🔄 RESTART LEVEL";
 }
}
function update(dt){
 if(!running)return;
 let left=keys.left||keys.arrowleft||keys.a;
 let right=keys.right||keys.arrowright||keys.d;
 let braking=keys.brake||keys.arrowdown||keys.s;
 let boosting=(keys.nitro||keys[" "])&&nitro>0;
 let difficulty=mode==="free"?0:level-1;
 let base=100+Math.min(140,difficulty*2.2);
 let desired=braking?35:boosting?Math.min(maxSpeed+60,base+90):Math.min(maxSpeed,base);
 speed+=(desired-speed)*dt*1.4;
 if(boosting){nitro=Math.max(0,nitro-24*dt)}else{nitro=Math.min(100,nitro+7*dt)}
 let steerInput=(right?1:0)-(left?1:0);
 steer+=(steerInput-steer)*dt*7;
 targetX+=steer*dt*(speed/100)*8;
 targetX=Math.max(-9.3,Math.min(9.3,targetX));
 player.position.x+=(targetX-player.position.x)*Math.min(1,dt*7);
 player.rotation.z=-steer*.12;
 player.rotation.y=-steer*.08;
 let movement=(speed/3.6)*dt;
 distance+=movement;
 let worldMove=movement*1.8;
 roadLines.forEach(l=>{l.position.z+=worldMove;if(l.position.z>8)l.position.z-=roadLength});
 objects.forEach(o=>{
  o.mesh.position.z+=worldMove;
  if(o.mesh.position.z>20){o.mesh.position.z=-250-Math.random()*80;o.mesh.position.x=(o.mesh.position.x<0?-1:1)*(15+Math.random()*15)}
 });
 traffic.forEach(c=>{
  c.position.z+=worldMove*(1+(difficulty*.003));
  if(c.position.z>10){c.position.z=-180-Math.random()*100;c.position.x=randomLane()}
  if(Math.abs(c.position.z-player.position.z)<2.6&&Math.abs(c.position.x-player.position.x)<1.8){endRace(false)}
 });
 coins.forEach(c=>{
  c.position.z+=worldMove;
  c.rotation.y+=dt*3;
  c.position.y=1.4+Math.sin(performance.now()*.004+c.position.z)*.15;
  if(c.position.z>8){c.position.z=-180-Math.random()*100;c.position.x=randomLane()}
  if(Math.abs(c.position.z-player.position.z)<2.5&&Math.abs(c.position.x-player.position.x)<1.8){
   coinCount++;$("coinText").textContent=coinCount;
   c.position.z=-220-Math.random()*80;c.position.x=randomLane();
  }
 });
 if(weather==="rain"){
  let a=rain[0].geometry.attributes.position;
  for(let i=0;i<a.count;i++){
   a.array[i*3+1]-=35*dt;
   a.array[i*3+2]+=worldMove*.3;
   if(a.array[i*3+1]<-5){a.array[i*3+1]=25+Math.random()*10;a.array[i*3+2]=-Math.random()*200}
  }
  a.needsUpdate=true;
 }
 camera.position.x+=(player.position.x*.35-camera.position.x)*dt*2;
 camera.lookAt(player.position.x*.25,1,-15);
 $("speed").textContent=Math.round(speed);
 $("distanceText").textContent=Math.floor(distance);
 $("nitroFill").style.width=nitro+"%";
 if(mode==="career"&&distance>=finishDistance){
  endRace(coinCount>=requiredCoins);
 }
}
function animate(){
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.04);
 if(running)update(dt);
 renderer.render(scene,camera);
}
init();
$("unlockText").textContent="Unlocked levels: "+unlocked;
</script>
</body>
</html>
