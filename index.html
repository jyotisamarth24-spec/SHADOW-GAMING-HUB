<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAMING ARENA - CRASH EDITION</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07101c;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#061324dd;border:1px solid #35caff77;padding:12px 17px;border-radius:12px}
.big{font-size:27px;font-weight:900;color:#00eaff}
.small{font-size:10px;letter-spacing:2px;color:#aabed3}
#nitro{position:fixed;top:90px;left:50%;transform:translateX(-50%);width:170px;text-align:center;pointer-events:none}
#bar{height:9px;background:#27364d;border-radius:20px;margin-top:6px;overflow:hidden}
#fill{height:100%;width:100%;background:linear-gradient(90deg,#00eaff,#8b45ff)}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.group{display:flex;gap:12px}
.ctrl{width:65px;height:65px;border:1px solid #ffffff88;border-radius:16px;background:#142c49dd;color:white;font-size:24px;font-weight:bold;pointer-events:auto;touch-action:none}
#screen{position:fixed;inset:0;background:#020817dd;display:flex;align-items:center;justify-content:center;text-align:center}
.card{background:#0c1d33;border:1px solid #00cfff88;border-radius:20px;padding:30px;width:min(90%,430px)}
h1{color:#00eaff;font-size:33px}
button.start{border:0;background:linear-gradient(90deg,#00cfff,#6552ff);color:white;padding:15px 35px;border-radius:30px;font-weight:bold;font-size:17px}
#crashText{color:#ff3b3b;font-size:29px;font-weight:900}
</style>
</head>
<body>
<div id="hud">
 <div class="panel"><div class="small">SPEED</div><span class="big" id="speed">000</span> KM/H</div>
 <div class="panel"><div class="small">COINS</div><span class="big" id="coins">0</span></div>
 <div class="panel"><div class="small">DISTANCE</div><span class="big" id="dist">0</span> m</div>
</div>
<div id="nitro"><div class="small">NITRO POWER</div><div id="bar"><div id="fill"></div></div></div>
<div id="controls">
 <div class="group">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div class="group">
  <button class="ctrl" id="brake">▼</button>
  <button class="ctrl" id="boost">⚡</button>
 </div>
</div>
<div id="screen">
 <div class="card">
  <h1>GAMING ARENA</h1>
  <p>ULTRA CRASH RACING</p>
  <p id="crashText">READY TO RACE?</p>
  <p>Collect coins. Avoid traffic. Survive the crash!</p>
  <button class="start" id="play">START RACING</button>
  <p class="small">WASD / ARROWS · SPACE = NITRO</p>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){alert("3D engine failed to load. Check your internet.");throw Error("Three.js missing")}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x829bb5);
scene.fog=new THREE.Fog(0x829bb5,60,240);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
camera.position.set(0,5.5,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8eaff,0x252b3c,1.6));
const sun=new THREE.DirectionalLight(0xffe5bf,2);
sun.position.set(-30,50,30);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(color,metalness=0,roughness=.5,emissive=0)=>{
 return new THREE.MeshStandardMaterial({color,metalness,roughness,emissive,emissiveIntensity:emissive?1.5:0});
};
const asphalt=mat(0x252c35,0,.95);
const white=mat(0xffffff);
const buildingMat=[mat(0x26374e),mat(0x35475c),mat(0x202c40),mat(0x43536b)];
const windowMat=mat(0xffd98a,0,.3,0xffa32d);
const blueWindow=mat(0x63cfff,0,.3,0x1479aa);
const metal=mat(0xaebdca,.85,.2);
const rubber=mat(0x090b0f,0,.9);

function block(parent,x,y,z,w,h,d,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}

// Road
block(scene,0,-.35,-110,17,.2,400,asphalt);
block(scene,0,-.65,-110,500,.5,400,mat(0x24303a));
for(let x of [-8.4,8.4])block(scene,x,-.2,-110,.22,.18,400,mat(0x00bde8,0,.3,0x0099cc));
for(let x of [-2.8,2.8]){
 for(let i=0;i<35;i++)block(scene,x,-.23,-i*12,.12,.035,5,white);
}

// City
const buildings=[];
for(let side of [-1,1]){
 for(let i=0;i<25;i++){
  const g=new THREE.Group();
  const w=8+Math.random()*8,h=15+Math.random()*30,d=8+Math.random()*10;
  block(g,0,h/2,0,w,h,d,buildingMat[Math.floor(Math.random()*4)]);
  for(let y=0;y<h/2;y++){
   for(let x=0;x<Math.floor(w/1.8);x++){
    if(Math.random()>.25){
     block(g,-w/2+1+x*1.6,1+y*2.2,d/2+.04,.65,.85,.07,
     Math.random()>.5?windowMat:blueWindow);
    }
   }
  }
  g.position.set(side*(18+Math.random()*22),0,-i*20-10);
  scene.add(g);buildings.push(g);
 }
}

// Player car
function makeCar(color=0xe51b38){
 const root=new THREE.Group();
 const paint=mat(color,.8,.2);
 const glass=mat(0x142e44,.65,.12);
 const head=mat(0xffffff,.2,.2,0xffffff);
 const tail=mat(0xff1010,.2,.2,0xff0000);

 // Sculpted body with multiple panels
 block(root,0,.78,0,2.15,.58,4.2,paint);
 block(root,0,1.25,-.45,1.78,.65,2.25,paint);
 block(root,0,1.48,-.4,1.52,.5,1.9,glass);
 block(root,0,1.02,-1.52,1.85,.2,.8,paint);
 block(root,0,.48,2.12,2,.22,.22,mat(0x111820));
 block(root,0,.48,-2.15,1.85,.15,.2,tail);

 // Bonnet and bumper
 block(root,0,.85,-1.75,1.8,.12,.65,paint);
 block(root,0,.55,-2.15,1.9,.25,.2,mat(0x11151c));
 block(root,0,1.65,-.4,1.1,.12,.18,paint);

 // Headlights and rear lights
 for(let x of [-.72,.72]){
  block(root,x,.86,-2.13,.4,.18,.09,head);
  block(root,x,.8,2.13,.4,.15,.08,tail);
  block(root,x,.45,-2.24,.22,.1,.08,mat(0x00cfff,0,.3,0x00cfff));
 }

 // Side skirts
 for(let x of [-1.05,1.05]){
  block(root,x,.43,0,.12,.18,2.5,mat(0x10151d));
  block(root,x,1.05,.2,.12,.2,1.4,paint);
 }

 // Rear spoiler
 block(root,0,1.5,1.9,1.7,.12,.35,mat(0x141820,.6,.25));
 for(let x of [-.6,.6])block(root,x,1.35,1.85,.12,.35,.12,mat(0x141820));

 // Wheels and rims
 const wheels=[];
 for(let x of [-1.1,1.1]){
  for(let z of [-1.4,1.4]){
   const wheel=new THREE.Group();
   wheel.position.set(x,.48,z);
   const tyre=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.3,24),rubber);
   tyre.rotation.z=Math.PI/2;tyre.castShadow=true;wheel.add(tyre);
   const rim=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.32,24),metal);
   rim.rotation.z=Math.PI/2;wheel.add(rim);
   for(let k=0;k<5;k++){
    const spoke=block(wheel,0,0,0,.035,.38,.045,metal);
    spoke.rotation.y=k*Math.PI/5;
   }
   root.add(wheel);wheels.push(wheel);
  }
 }
 // exhaust pipes
 for(let x of [-.45,.45]){
  const pipe=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.28,12),metal);
  pipe.rotation.x=Math.PI/2;pipe.position.set(x,.48,2.2);root.add(pipe);
 }
 root.userData.wheels=wheels;
 return root;
}

const player=makeCar(0xe51b38);
scene.add(player);
player.position.set(0,0,4);

// Traffic vehicles
const traffic=[];
const trafficColors=[0x1677db,0xf0b92c,0xeeeeee,0x20a977,0x8737ce,0x242424];
function makeTraffic(z){
 const car=makeCar(trafficColors[Math.floor(Math.random()*trafficColors.length)]);
 car.scale.setScalar(.82);
 car.position.set([-4.8,0,4.8][Math.floor(Math.random()*3)],0,z);
 scene.add(car);traffic.push(car);
}
for(let i=0;i<9;i++)makeTraffic(-35-i*35);

// Coins
const coins=[];
const coinMaterial=new THREE.MeshStandardMaterial({
 color:0xffce28,metalness:.9,roughness:.17,
 emissive:0x704300,emissiveIntensity:1.2
});
for(let i=0;i<35;i++){
 const g=new THREE.Group();
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.55,.13,14,32),coinMaterial);
 g.add(ring);
 const center=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.09,24),coinMaterial);
 center.rotation.x=Math.PI/2;g.add(center);
 g.position.set([-4.5,0,4.5][i%3],1.35,-25-i*18);
 scene.add(g);coins.push(g);
}

// Sparks, smoke and flying parts
const effects=[];
function burst(x,y,z,color,count=15){
 for(let i=0;i<count;i++){
  const m=new THREE.Mesh(
   new THREE.SphereGeometry(.08+Math.random()*.07,6,6),
   new THREE.MeshBasicMaterial({color})
  );
  m.position.set(x,y,z);scene.add(m);
  effects.push({
   mesh:m,life:.8+Math.random()*.6,
   velocity:new THREE.Vector3(
    (Math.random()-.5)*12,
    Math.random()*9,
    (Math.random()-.5)*12
   )
  });
 }
}
function debris(x,y,z){
 for(let i=0;i<7;i++){
  const m=block(scene,x+(Math.random()-.5),y,z+(Math.random()-.5),
   .3,.15,.35,mat([0xe51b38,0x151820,0xaab8c7][i%3],.5,.3));
  effects.push({mesh:m,life:2,velocity:new THREE.Vector3(
   (Math.random()-.5)*8,Math.random()*8,(Math.random()-.5)*8
  ),debris:true});
 }
}

// State
let running=false,speed=0,score=0,distance=0,nitro=100;
let boost=false,braking=false,crashTimer=0;
const keys={};
const screen=document.getElementById("screen");
const crashText=document.getElementById("crashText");
const play=document.getElementById("play");

function startGame(){
 running=true;speed=0;score=0;distance=0;nitro=100;crashTimer=0;
 player.position.set(0,0,4);
 traffic.forEach((c,i)=>{c.position.z=-35-i*35;c.position.x=[-4.8,0,4.8][i%3]});
 coins.forEach((c,i)=>{c.position.z=-25-i*18;c.position.x=[-4.5,0,4.5][i%3]});
 screen.style.display="none";
 crashText.textContent="READY TO RACE?";
}
play.onclick=startGame;

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space")e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function hold(id,fn){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture(e.pointerId);fn(true)});
 const off=e=>{e.preventDefault();fn(false)};
 el.addEventListener("pointerup",off);
 el.addEventListener("pointercancel",off);
 el.addEventListener("lostpointercapture",off);
}
hold("left",v=>keys.left=v);
hold("right",v=>keys.right=v);
hold("boost",v=>boost=v);
hold("brake",v=>braking=v);

function endCrash(){
 running=false;speed=0;
 crashText.textContent="💥 CAR DESTROYED!";
 play.textContent="RACE AGAIN";
 screen.style.display="flex";
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);
 if(running){
  const left=keys.left||keys.a||keys.arrowleft;
  const right=keys.right||keys.d||keys.arrowright;
  const useBoost=boost&&nitro>0&&!braking;
  if(useBoost)nitro=Math.max(0,nitro-26*dt);
  else nitro=Math.min(100,nitro+8*dt);

  const target=braking?25:(useBoost?260:175);
  speed+=(target-speed)*dt*1.4;
  const movement=speed/3.6;

  if(left)player.position.x-=7*dt;
  if(right)player.position.x+=7*dt;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-5.4,5.4);
  player.rotation.z=left?.1:right?-.1:player.rotation.z*.9;
  player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,left?.12:right?-.12:0,dt*4);
  player.userData.wheels.forEach(w=>w.rotation.x+=movement*dt*1.5);

  distance+=movement*dt;

  buildings.forEach(b=>{
   b.position.z+=movement*dt;
   if(b.position.z>40)b.position.z-=500;
  });

  traffic.forEach(car=>{
   car.position.z+=movement*dt*.8;
   if(car.position.z>15){
    car.position.z=-220-Math.random()*100;
    car.position.x=[-4.8,0,4.8][Math.floor(Math.random()*3)];
   }
   // Crash collision
   if(Math.abs(car.position.z-player.position.z)<2.8&&
      Math.abs(car.position.x-player.position.x)<1.75){
    const x=(car.position.x+player.position.x)/2;
    burst(x,1,3,0xffaa22,30);
    burst(x,1,3,0xeeeeee,18);
    debris(x,1,3);
    car.position.z=-250;
    crashTimer=1;
    endCrash();
   }
  });

  coins.forEach(c=>{
   c.rotation.y+=dt*3;
   c.rotation.z+=dt*1.4;
   c.position.z+=movement*dt;
   if(c.position.z>12){
    c.position.z=-260-Math.random()*100;
    c.position.x=[-4.5,0,4.5][Math.floor(Math.random()*3)];
   }
   if(c.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,1,0)))<1.7){
    score+=10;
    burst(c.position.x,1.4,c.position.z,0xffd52e,8);
    c.position.z=-260-Math.random()*100;
   }
  });

  // Nitro flames
  if(useBoost&&Math.random()<.65)burst(player.position.x,.65,6,0x00cfff,2);

  camera.position.x+=(player.position.x*.3-camera.position.x)*dt*2;
  camera.position.y+=(5.4-camera.position.y)*dt*2;
  camera.lookAt(player.position.x*.35,1,-7);

  document.getElementById("speed").textContent=Math.round(speed).toString().padStart(3,"0");
  document.getElementById("coins").textContent=score;
  document.getElementById("dist").textContent=Math.floor(distance);
  document.getElementById("fill").style.width=nitro+"%";
 }

 // Effects continue even after crash
 for(let i=effects.length-1;i>=0;i--){
  const p=effects[i];
  p.life-=dt;
  p.velocity.y-=12*dt;
  p.mesh.position.addScaledVector(p.velocity,dt);
  p.mesh.rotation.x+=dt*5;
  p.mesh.rotation.z+=dt*3;
  if(p.life<=0){
   scene.remove(p.mesh);
   effects.splice(i,1);
  }
 }
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
