<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMING ARENA 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050a16;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.panel{background:#071529dd;border:1px solid #00eaff;border-radius:12px;padding:10px;box-shadow:0 0 15px #00dfff44}
h2{font-size:18px;color:#00eaff;margin:0 0 5px}
small{color:#b7eaff}
#stats{font-size:12px;line-height:1.8;text-align:right;font-weight:bold}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020716aa;text-align:center}
#startbox{background:#071529ee;border:1px solid #00eaff;border-radius:18px;padding:25px;width:min(90%,380px);box-shadow:0 0 30px #00cfff55}
#startbox h1{color:#00eaff}
#startbox p{line-height:1.7}
#controls{position:fixed;bottom:16px;left:0;right:0;padding:0 15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.group{display:flex;gap:8px}
button{pointer-events:auto;color:white;background:#0a1d35dd;border:1px solid #00eaff;border-radius:14px;min-width:54px;height:55px;font-size:22px;font-weight:bold;touch-action:none}
button:active{background:#007d9c}
#nitro{font-size:12px;border-color:#ffca36}
#startbutton{background:#00dfff;color:#00111c;border:0;width:100%;height:52px;font-size:17px}
#hint{position:fixed;bottom:83px;left:0;right:0;text-align:center;font-size:11px;color:#c3f8ff;pointer-events:none}
</style>
</head>
<body>
<div id="top">
 <div class="panel">
  <h2>⚡ GAMING ARENA</h2>
  <small>3D STREET RACER</small>
 </div>
 <div class="panel" id="stats">SPEED: 0 km/h<br>DISTANCE: 0 m<br>COINS: 0</div>
</div>

<div id="start">
 <div id="startbox">
  <h1>GAMING ARENA</h1>
  <p>🏎️ 3D STREET RACING<br>⚡ NITRO BOOST<br>🪙 COLLECT COINS<br>🚧 DODGE TRAFFIC</p>
  <button id="startbutton">START RACING</button>
  <p><small>Use arrow keys or on-screen controls</small></p>
 </div>
</div>

<div id="hint">← → STEER &nbsp; ↑ ACCELERATE &nbsp; ↓ BRAKE &nbsp; SPACE NITRO</div>
<div id="controls">
 <div class="group">
  <button id="left">◀</button><button id="right">▶</button>
 </div>
 <div class="group">
  <button id="brake">▼</button><button id="gas">▲</button><button id="nitro">⚡<br>NITRO</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const stats=document.getElementById("stats");
const overlay=document.getElementById("start");
const startbutton=document.getElementById("startbutton");

if(!window.THREE){
 document.getElementById("startbox").innerHTML=
 "<h2>3D LIBRARY NOT LOADED</h2><p>Check your internet connection and reload this page.</p>";
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x071326);
scene.fog=new THREE.Fog(0x071326,45,190);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
camera.position.set(0,6,11);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xa6dcff,0x253044,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-12,25,10);
sun.castShadow=true;
scene.add(sun);

function material(color,emissive=0,metalness=.15,roughness=.45){
 return new THREE.MeshStandardMaterial({color,emissive,metalness,roughness});
}
const asphalt=material(0x252b37);
const white=material(0xffffff,0x444444);
const cyan=material(0x00dfff,0x004466,.2,.3);
const yellow=material(0xffcc22,0x554000,.6,.25);
const black=material(0x10141c);
const groundmat=material(0x101d27);
const lampmat=material(0x00cfff,0x007799);
const redlight=material(0xff142c,0x880011);

function box(parent,x,y,z,w,h,d,mat){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),groundmat);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.16,-100);
scene.add(ground);

box(scene,0,-.05,-85,16,.12,230,asphalt);
for(const x of [-8,8])box(scene,x,.02,-85,.22,.06,230,cyan);

const roadmarks=[];
for(let z=-205;z<20;z+=9){
 for(const x of [-2.65,2.65])
 roadmarks.push(box(scene,x,.025,z,.12,.035,3.8,white));
}

// Build a detailed 3D sports car
function makeCar(color,isPlayer=false){
 const car=new THREE.Group();
 const paint=material(color,0,.55,.23);
 const glass=material(0x71cfff,0x103b55,.5,.15);
 const tire=material(0x080b10);
 const rim=material(0xc9e6ff,0x111111,.8,.2);

 box(car,0,.58,0,1.8,.48,3.5,paint);
 box(car,0,.94,-.34,1.38,.5,1.7,paint);
 box(car,0,1.01,-.38,1.2,.34,1.38,glass);
 box(car,0,.35,0,1.65,.13,2.8,black);
 box(car,0,.48,-1.8,1.75,.12,.16,black);
 box(car,0,.48,1.8,1.75,.12,.16,black);
 box(car,-.55,.72,-1.79,.35,.16,.08,white);
 box(car,.55,.72,-1.79,.35,.16,.08,white);
 box(car,-.57,.72,1.79,.34,.13,.08,redlight);
 box(car,.57,.72,1.79,.34,.13,.08,redlight);
 box(car,0,1.2,.9,1.4,.08,.16,paint);

 for(const x of [-.94,.94]){
  for(const z of [-1.12,1.12]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.24,18),tire);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.36,z);
   car.add(wheel);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.255,12),rim);
   hub.rotation.z=Math.PI/2;
   hub.position.set(x,.36,z);
   car.add(hub);
  }
 }
 if(isPlayer){
  const glow=new THREE.PointLight(0x00ccff,2,9);
  glow.position.set(0,1,-2);
  car.add(glow);
 }
 scene.add(car);
 return car;
}

const player=makeCar(0x00aaff,true);
player.position.set(0,.1,3);

// Neon city buildings
const buildings=[];
for(let i=0;i<48;i++){
 for(const side of [-1,1]){
  const w=3+Math.random()*4;
  const h=7+Math.random()*18;
  const g=new THREE.Group();
  box(g,0,h/2,0,w,h,5,
      material([0x182942,0x202b40,0x19233b,0x30364a][i%4]));
  const windowmat=material(i%2?0x00baff:0xffb52b,
                            i%2?0x003355:0x443000);
  for(let y=2;y<h-1;y+=2.5){
   for(let x=-w/2+.5;x<w/2-.3;x+=1.1){
    box(g,x,y,2.53,.36,.65,.035,windowmat);
   }
  }
  g.position.set(side*(12+Math.random()*7),0,-i*8-10);
  scene.add(g);
  buildings.push(g);
 }
}

// Street lights
const lamps=[];
for(let i=0;i<22;i++){
 for(const side of [-1,1]){
  const g=new THREE.Group();
  box(g,0,2.2,0,.12,4.4,.12,black);
  box(g,-.55,4.35,0,1.1,.12,.12,lampmat);
  const glow=new THREE.PointLight(0x00bfff,1,10);
  glow.position.set(-.55,4.1,0);
  g.add(glow);
  g.position.set(side*9,0,-i*16-10);
  scene.add(g);
  lamps.push(g);
 }
}

// Traffic
const traffic=[];
const lanePositions=[-5.1,0,5.1];
for(let i=0;i<8;i++){
 const car=makeCar([0xff233d,0xffa600,0x854dff,0xffffff][i%4]);
 car.scale.setScalar(.85);
 car.position.set(lanePositions[i%3],.1,-32-i*24);
 traffic.push(car);
}

// Collectible spinning coins
const coins=[];
for(let i=0;i<25;i++){
 const coin=new THREE.Mesh(
  new THREE.TorusGeometry(.48,.15,10,20),yellow);
 coin.position.set(lanePositions[i%3],1.25,-18-i*12);
 scene.add(coin);
 coins.push(coin);
}

// Keyboard and touch controls
const keys={};
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))
 e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function hold(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 function release(e){e.preventDefault();keys[key]=false;}
 b.addEventListener("pointerup",release);
 b.addEventListener("pointercancel",release);
 b.addEventListener("lostpointercapture",()=>keys[key]=false);
}
hold("left","arrowleft");
hold("right","arrowright");
hold("gas","arrowup");
hold("brake","arrowdown");
hold("nitro"," ");

let running=false;
let speed=0,distance=0,score=0,last=performance.now();
startbutton.addEventListener("click",()=>{
 running=true;
 overlay.style.display="none";
});

function recycleTraffic(car){
 car.position.z=-155-Math.random()*50;
 car.position.x=lanePositions[Math.floor(Math.random()*3)];
}
function recycleCoin(coin){
 coin.position.z=-190-Math.random()*60;
 coin.position.x=lanePositions[Math.floor(Math.random()*3)];
 coin.visible=true;
}

function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min((now-last)/1000,.04);
 last=now;

 if(running){
  const nitro=keys[" "]||keys["shift"];
  const gas=keys["arrowup"]||keys["w"];
  const brake=keys["arrowdown"]||keys["s"];
  const target=nitro?65:gas?40:18;
  speed+=(target-speed)*dt*1.5;
  if(brake)speed=Math.max(0,speed-70*dt);

  if(keys["arrowleft"]||keys["a"])player.position.x-=10*dt;
  if(keys["arrowright"]||keys["d"])player.position.x+=10*dt;
  player.position.x=Math.max(-6.1,Math.min(6.1,player.position.x));
  player.rotation.z=keys["arrowleft"]||keys["a"]?.06:
                    keys["arrowright"]||keys["d"]?-.06:0;

  const move=speed*dt*.9;
  distance+=move;
  roadmarks.forEach(m=>{
   m.position.z+=move;
   if(m.position.z>15)m.position.z-=225;
  });
  buildings.forEach(b=>{
   b.position.z+=move;
   if(b.position.z>25)b.position.z-=390;
  });
  lamps.forEach(l=>{
   l.position.z+=move;
   if(l.position.z>20)l.position.z-=350;
  });

  traffic.forEach(car=>{
   car.position.z+=move*.92;
   if(car.position.z>10)recycleTraffic(car);
   if(Math.abs(car.position.z-player.position.z)<2.2 &&
      Math.abs(car.position.x-player.position.x)<1.5){
    speed=Math.min(speed,8);
    recycleTraffic(car);
   }
  });

  coins.forEach(coin=>{
   coin.position.z+=move;
   coin.rotation.y+=dt*3;
   if(coin.position.z>8)recycleCoin(coin);
   if(coin.visible &&
      Math.abs(coin.position.z-player.position.z)<2 &&
      Math.abs(coin.position.x-player.position.x)<1.5){
    coin.visible=false;
    score++;
   }
  });
 }

 camera.position.x+=(player.position.x*.3-camera.position.x)*dt*2;
 camera.lookAt(player.position.x*.2,.7,-23);
 stats.innerHTML="SPEED: "+Math.round(speed*3)+" km/h<br>DISTANCE: "+
 Math.floor(distance)+" m<br>COINS: "+score;
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
