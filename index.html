<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMING ARENA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at top,#193d72,#080d1b 65%);
 text-align:center;padding:25px 15px;
}
header{padding:35px 10px}
h1{font-size:clamp(38px,8vw,70px);margin:0;color:#00d9ff;
 text-shadow:0 0 15px #008cff,0 0 35px #0055ff}
header p{color:#c9d9f2;font-size:17px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
 gap:22px;max-width:900px;margin:35px auto}
.card{background:#14233a;border:1px solid #31577f;border-radius:20px;
 padding:25px 18px;box-shadow:0 10px 30px #0008}
.art{font-size:75px;margin:10px}
h2{margin:10px}
.card p{color:#b9cce3;min-height:40px}
a{display:inline-block;text-decoration:none}
button{border:0;border-radius:12px;padding:14px 23px;
 background:linear-gradient(90deg,#007bff,#00c6ff);
 color:white;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{filter:brightness(1.2);transform:scale(1.04)}
footer{color:#91a7c4;margin-top:40px}
</style>
</head>
<body>
<header>
 <h1>GAMING ARENA</h1>
 <p>ONE WEBSITE. MULTIPLE GAMES. UNLIMITED FUN.</p>
</header>

<div class="games">
 <section class="card">
  <div class="art">🏎️</div>
  <h2>RACING LEGENDS</h2>
  <p>Race through traffic, collect coins and use nitro boost!</p>
  <a href="racing.html"><button>PLAY RACING</button></a>
 </section>

 <section class="card">
  <div class="art">🧠</div>
  <h2>QUIZ CHALLENGE</h2>
  <p>Test your knowledge and challenge your brain.</p>
  <a href="quiz.html"><button>PLAY QUIZ</button></a>
 </section>
</div>

<footer>© 2026 GAMING ARENA | PLAY • RACE • WIN</footer>
</body>
</html>
