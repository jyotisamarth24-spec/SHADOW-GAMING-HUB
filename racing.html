<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMING ARENA - Open World Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;z-index:5;text-shadow:0 2px 5px #000}
#speed{font-size:36px;font-weight:bold}
#nitro{width:170px;height:12px;background:#333;border-radius:10px;overflow:hidden;margin-top:8px}
#bar{height:100%;width:100%;background:#00d9ff}
#message{position:fixed;top:15px;right:15px;text-align:right;text-shadow:0 2px 5px black}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:10;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto}
button{width:65px;height:65px;border:2px solid #ffffff99;border-radius:18px;background:#111b;color:white;font-size:24px;font-weight:bold;touch-action:none}
#nitroBtn{background:#007bffbb;width:85px}
#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;text-shadow:0 2px 5px black;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <div>GAMING ARENA</div>
  <div id="speed">0 KM/H</div>
  <div>NITRO</div>
  <div id="nitro"><div id="bar"></div></div>
  <div id="coins">🪙 0</div>
</div>
<div id="message">OPEN WORLD<br>FREE ROAM</div>
<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="group">
    <button id="nitroBtn">N₂O</button>
    <button id="brake">▼</button>
    <button id="gas">▲</button>
  </div>
</div>
<div id="hint">WASD / Arrow keys to drive • Space for nitro</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bc9f5);
scene.fog = new THREE.Fog(0x8bc9f5, 100, 650);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xd9efff,0x587344,2));
const sun = new THREE.DirectionalLight(0xfff1d0,3);
sun.position.set(-80,120,60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(1200,1200),
 new THREE.MeshStandardMaterial({color:0x528b42,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.15;
ground.receiveShadow=true;
scene.add(ground);

// Rolling hills
for(let i=0;i<30;i++){
 const hill=new THREE.Mesh(
  new THREE.SphereGeometry(1,24,16),
  new THREE.MeshStandardMaterial({color:[0x477b42,0x5b9149,0x719a52][i%3],roughness:1})
 );
 hill.scale.set(35+Math.random()*55,9+Math.random()*16,30+Math.random()*40);
 hill.position.set((Math.random()-.5)*850,0,(Math.random()-.5)*850);
 hill.position.y=-hill.scale.y+1;
 scene.add(hill);
}

// Distant mountains
for(let i=0;i<24;i++){
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(35+Math.random()*35,65+Math.random()*65,5),
  new THREE.MeshStandardMaterial({color:0x657b83,roughness:1})
 );
 mountain.position.set(-500+i*43,20,-370-Math.random()*80);
 mountain.rotation.y=Math.random();
 scene.add(mountain);
}

// Winding road made from connected segments
const roadPoints=[
 new THREE.Vector3(0,0,0),
 new THREE.Vector3(0,0,-100),
 new THREE.Vector3(45,0,-190),
 new THREE.Vector3(125,0,-250),
 new THREE.Vector3(220,0,-260),
 new THREE.Vector3(310,0,-210),
 new THREE.Vector3(360,0,-120),
 new THREE.Vector3(330,0,-20),
 new THREE.Vector3(250,0,65),
 new THREE.Vector3(150,0,110),
 new THREE.Vector3(65,0,90),
 new THREE.Vector3(0,0,0)
];
const curve=new THREE.CatmullRomCurve3(roadPoints);
const roadGeometry=new THREE.TubeGeometry(curve,500,7,8,false);
const road=new THREE.Mesh(roadGeometry,new THREE.MeshStandardMaterial({color:0x30343a,roughness:.85}));
road.position.y=.12;
scene.add(road);

// Roadside lines and scenery
for(let i=0;i<500;i++){
 const t=i/500;
 const p=curve.getPointAt(t);
 const tangent=curve.getTangentAt(t);
 const side=new THREE.Vector3(-tangent.z,0,tangent.x);
 for(const s of [-1,1]){
  const pos=p.clone().addScaledVector(side,s*8);
  const post=new THREE.Mesh(
   new THREE.BoxGeometry(.25,.65,.25),
   new THREE.MeshStandardMaterial({color:0xffffff})
  );
  post.position.set(pos.x,.35,pos.z);
  scene.add(post);
 }
 if(i%3===0){
  const pos=p.clone().addScaledVector(side, (Math.random()>.5?1:-1)*(17+Math.random()*40));
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.5,.8,5,7),new THREE.MeshStandardMaterial({color:0x634329}));
  trunk.position.set(pos.x,2.5,pos.z);
  trunk.castShadow=true;
  scene.add(trunk);
  const leaves=new THREE.Mesh(new THREE.SphereGeometry(3.5+Math.random()*2,9,8),new THREE.MeshStandardMaterial({color:[0x176b32,0x247b38,0x388b40][i%3]}));
  leaves.position.set(pos.x,6,pos.z);
  leaves.castShadow=true;
  scene.add(leaves);
 }
}

// Extra scattered trees
for(let i=0;i<260;i++){
 const x=(Math.random()-.5)*700;
 const z=(Math.random()-.5)*700;
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,4,7),new THREE.MeshStandardMaterial({color:0x70482d}));
 trunk.position.set(x,2,z);
 const top=new THREE.Mesh(new THREE.ConeGeometry(3+Math.random()*2,8,8),new THREE.MeshStandardMaterial({color:0x216b35}));
 top.position.set(x,7,z);
 scene.add(trunk,top);
}

// Clouds
for(let i=0;i<35;i++){
 const cloud=new THREE.Group();
 for(let j=0;j<5;j++){
  const puff=new THREE.Mesh(new THREE.SphereGeometry(4+Math.random()*3,12,10),new THREE.MeshStandardMaterial({color:0xffffff,roughness:1}));
  puff.position.set(j*5,Math.random()*2,Math.random()*3);
  cloud.add(puff);
 }
 cloud.position.set((Math.random()-.5)*700,55+Math.random()*45,(Math.random()-.5)*700);
 scene.add(cloud);
}

// Sports car
const car=new THREE.Group();
const paint=new THREE.MeshStandardMaterial({color:0xe51c35,metalness:.65,roughness:.25});
const dark=new THREE.MeshStandardMaterial({color:0x111820,metalness:.5,roughness:.25});
const glass=new THREE.MeshStandardMaterial({color:0x172f40,metalness:.5,roughness:.15});
const body=new THREE.Mesh(new THREE.BoxGeometry(3.3,.75,6),paint);
body.position.y=.95;
body.castShadow=true;
car.add(body);
const hood=new THREE.Mesh(new THREE.BoxGeometry(3.1,.28,1.8),paint);
hood.position.set(0,1.35,-1.65);
car.add(hood);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.4,.85,2.5),glass);
cabin.position.set(0,1.7,.35);
car.add(cabin);
const roof=new THREE.Mesh(new THREE.BoxGeometry(2.35,.16,2.2),paint);
roof.position.set(0,2.15,.35);
car.add(roof);
for(const x of [-1,1]){
 const light=new THREE.Mesh(new THREE.BoxGeometry(.65,.18,.12),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:1.2}));
 light.position.set(x*1.1,1.05,-3.04);
 car.add(light);
 const tail=new THREE.Mesh(new THREE.BoxGeometry(.7,.18,.12),new THREE.MeshStandardMaterial({color:0xff1111,emissive:0xff0000,emissiveIntensity:.7}));
 tail.position.set(x*1.05,1.05,3.04);
 car.add(tail);
}
const wheels=[];
for(const x of [-1.7,1.7]){
 for(const z of [-1.9,1.9]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.35,20),dark);
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.58,z);
  wheel.castShadow=true;
  car.add(wheel);
  wheels.push(wheel);
 }
}
car.position.set(0,0,0);
scene.add(car);

// Nitro glow
const flameMat=new THREE.MeshBasicMaterial({color:0x00cfff});
const flames=[];
for(const x of [-.8,.8]){
 const f=new THREE.Mesh(new THREE.ConeGeometry(.28,1.5,10),flameMat);
 f.rotation.x=-Math.PI/2;
 f.position.set(x,.8,3.65);
 f.visible=false;
 car.add(f);
 flames.push(f);
}

// Collectible coins
const coins=[];
for(let i=0;i<45;i++){
 const t=(i+.5)/45;
 const p=curve.getPointAt(t);
 const coin=new THREE.Mesh(new THREE.TorusGeometry(.8,.22,8,18),new THREE.MeshStandardMaterial({color:0xffd21a,metalness:.7,roughness:.2,emissive:0x553300}));
 coin.position.set(p.x,1.7,p.z);
 coin.rotation.x=Math.PI/2;
 scene.add(coin);
 coins.push(coin);
}

// Driving
const keys={};
let speed=0,steer=0,nitro=100,score=0;
let heading=0;
let boost=false;
function bindButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;});
 for(const ev of ['pointerup','pointerleave','pointercancel'])
  el.addEventListener(ev,()=>keys[key]=false);
}
bindButton('gas','gas');
bindButton('brake','brake');
bindButton('left','left');
bindButton('right','right');
bindButton('nitroBtn','nitro');
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const forward=keys.w||keys.arrowup||keys.gas;
 const backward=keys.s||keys.arrowdown||keys.brake;
 const left=keys.a||keys.arrowleft||keys.left;
 const right=keys.d||keys.arrowright||keys.right;
 boost=!!(keys[' ']||keys.nitro)&&nitro>0&&speed>2;

 if(forward)speed+=30*dt;
 else speed-=12*dt;
 if(backward)speed-=45*dt;
 if(boost){speed+=55*dt;nitro-=23*dt;}
 else nitro=Math.min(100,nitro+7*dt);
 speed=THREE.MathUtils.clamp(speed,-15,boost?95:65);

 const turn=(right?1:0)-(left?1:0);
 steer=THREE.MathUtils.damp(steer,turn,.13,dt);
 heading+=steer*dt*(.45+Math.abs(speed)*.012);
 car.rotation.y=heading;

 const direction=new THREE.Vector3(-Math.sin(heading),0,-Math.cos(heading));
 car.position.addScaledVector(direction,speed*dt*.45);
 car.position.y=0;
 wheels.forEach(w=>w.rotation.x-=speed*dt*.12);
 flames.forEach(f=>f.visible=boost);
 if(boost)flames.forEach(f=>f.scale.setScalar(.8+Math.random()));

 // Coin collection
 for(const coin of coins){
  coin.rotation.z+=dt*2;
  if(coin.visible&&coin.position.distanceTo(car.position)<3){
   coin.visible=false;score++;
   document.getElementById('coins').textContent='🪙 '+score;
  }
 }

 // Chase camera
 const offset=new THREE.Vector3(0,6,13).applyAxisAngle(new THREE.Vector3(0,1,0),heading);
 const target=car.position.clone().add(offset);
 camera.position.lerp(target,1-Math.exp(-4*dt));
 camera.lookAt(car.position.x,car.position.y+1.4,car.position.z);
 camera.fov=THREE.MathUtils.damp(camera.fov,boost?76:65,3,dt);
 camera.updateProjectionMatrix();

 document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.2)+' KM/H';
 document.getElementById('bar').style.width=nitro+'%';
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
